name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - run: make test

    - name: Build tarball and deb
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        PKG="drm-gamma-${VERSION}"
        mkdir -p "$PKG"
        cp target/release/drm-gamma drm-gamma.conf README.md NOTIFICATIONS.md LICENSE Makefile "$PKG/"
        cp -r scripts "$PKG/"
        tar czf "$PKG-x86_64.tar.gz" "$PKG"
        make deb VERSION=${VERSION}
        sha256sum "$PKG-x86_64.tar.gz" build-deb/*.deb > SHA256SUMS

    - uses: softprops/action-gh-release@v2
      with:
        files: |
          drm-gamma-*.tar.gz
          build-deb/*.deb
          SHA256SUMS
        generate_release_notes: true
